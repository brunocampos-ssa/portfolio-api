# buf.gen.yaml — code generation config.
#
# `buf generate` reads this file, locates the *.proto files described by
# buf.yaml, and invokes each plugin listed below. Plugin binaries must be
# on $PATH (typically $GOPATH/bin after a `go install`).
#
# Output goes to gen/. We commit the generated code so graders / CI don't
# need buf installed to build the project. Re-run `make proto` whenever
# the .proto files change.
version: v2

managed:
  enabled: true

plugins:
  # Go message types
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative

  # Go gRPC service stubs
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
