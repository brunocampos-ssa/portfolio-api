// AuthService — registration and login.
//
// Partial mirror of the REST /auth/* endpoints. Class 1 ships Register
// and Login over gRPC so students see how the same service surface is
// exposed across two transports without duplicating business logic.
// Refresh and Logout are deliberately REST-only in Class 1 — see the
// service docstring below and the README ("What's deferred to Aula 2")
// for the rationale.
syntax = "proto3";

package portfolio.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/brunocampos-ssa/portfolio-api/gen/portfolio/v1;portfoliov1";

// AuthService issues access + refresh tokens.
//
// Note: Refresh and Logout are deliberately REST-only in Module 4 Aula 1
// (see README, Aula 2 hooks). Class 1 keeps the gRPC surface focused on
// "auth issuance" so the chapter on refresh-token rotation lives entirely
// on the REST side. AuthService here is therefore minimal.
service AuthService {
  // Register creates a new user account. No token is returned — clients
  // call Login next, mirroring the REST flow.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login validates credentials and issues an access+refresh token pair.
  rpc Login(LoginRequest) returns (LoginResponse);
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expires_at = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp refresh_token_expires_at = 4;
}
